version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: omniops-postgres
    environment:
      POSTGRES_USER: omniops
      POSTGRES_PASSWORD: omniops_password
      POSTGRES_DB: omniops_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: omniops-redis
    ports:
      - "6379:6379"

  chromadb:
    image: chromadb/chroma:latest
    container_name: omniops-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/data

  api_gateway:
    build:
      context: ./backend/api_gateway
    container_name: omniops-gateway
    ports:
      - "8080:8080"
    environment:
      - SUPERVISOR_URL=http://supervisor:8081
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=super_secret_jwt_key_12345
      - RATE_LIMIT_PER_MINUTE=60
    depends_on:
      - redis

  supervisor:
    build:
      context: ./backend/services
    container_name: omniops-supervisor
    ports:
      - "8081:8081"
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - DB_URL=postgresql://omniops:omniops_password@postgres:5432/omniops_db
      - OPENAI_API_KEY=mock-key
      - OLLAMA_HOST=http://host.docker.internal:11434
    depends_on:
      - postgres
      - redis
      - chromadb

  frontend:
    build:
      context: ./frontend
    container_name: omniops-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - api_gateway

volumes:
  postgres_data:
  chroma_data:
